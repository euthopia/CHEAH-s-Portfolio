name: Deploy portfolio to Cloudflare Pages

on:
  push:
    branches: [ main, claude/dreamy-volta-u489fx ]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: 77f74c5f21b3f181aebe234d259f6ccf
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --force
      - name: Build (drops >25 MiB music masters, adds cache headers)
        run: npm run build:cloudflare
        env:
          VITE_COMPRESSED: '1'
          VITE_WHISPERS_COUNT: '30'
          VITE_MUSIC: '1'
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: dist
        run: npx -y wrangler@4 pages deploy . --project-name cheah-chern-eu --branch main --commit-hash ${{ github.sha }}
      - name: Missing token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret (Settings → Secrets and variables → Actions), then re-run this workflow."
          exit 1
